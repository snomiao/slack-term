name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # git tag + GitHub Release
      issues: write         # semantic-release comments
      pull-requests: write  # semantic-release comments
      id-token: write       # OIDC → npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile

      - run: bun run typecheck
      - run: bun run build

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: bunx semantic-release

      # Mirror each release to the old npm name, `slack-term` (renamed to
      # slack-hub). Same code, with npm/slack-term-README.md as its README
      # (a migration guide). The CLI prints a rename notice when installed under
      # this name. OIDC trusted publishing is set up for both packages; it covers
      # `npm publish` only, so `npm deprecate` has to be run with a user login.
      - name: Publish slack-term (deprecated alias)
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          v=$(node -p "require('./package.json').version")
          if ! git tag --points-at HEAD | grep -qx "v$v"; then echo "no release on this commit"; exit 0; fi
          if npm view "slack-term@$v" version >/dev/null 2>&1; then echo "slack-term@$v already published"; exit 0; fi
          cp npm/slack-term-README.md README.md
          npm pkg set name=slack-term description="DEPRECATED: renamed to slack-hub — npm i -g slack-hub. $(node -p "require('./package.json').description")"
          npm publish --access public
