name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ts:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # Whole-tree PII scan. The commit hook only sees added lines, so data
      # already in the tree is invisible to it — that is how real workspace data
      # once reached npm. This is the gate that catches it before a merge.
      - run: bun run scan-pii:all
      - run: bun run typecheck
      - run: bun run build
      - run: bunx vitest run --coverage --exclude "tests/parity.test.ts"
