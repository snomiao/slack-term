name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ts:
    name: TypeScript
    runs-on: ubuntu-latest
    # Without this a hang burns the full 6-hour job limit and reports as
    # "cancelled" — which reads like someone stopped it, not like a failure.
    # Every run for a month died that way. The suite takes ~30s, so 8 minutes is
    # already generous, and a timeout here is a loud, correctly-labelled failure.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # Whole-tree PII scan. The commit hook only sees added lines, so data
      # already in the tree is invisible to it — that is how real workspace data
      # once reached npm. This is the gate that catches it before a merge.
      - run: bun run scan-pii:all
      - run: bun run typecheck
      - run: bun run build
      # Run vitest under NODE, not bun. bun runs the app and the CLI fine, but
      # vitest is a node tool and its workers are the thing that will not shut
      # down here: every hung run leaves exactly three orphans behind —
      # `bun` (the vitest main process) plus two `node` workers — and the main
      # process then waits on them forever. All test files complete and pass
      # first, so this is teardown, not a test.
      #
      # It does not reproduce on Linux under the same bun at 2 or 4 visible
      # cores, so it is specific to this runner; running the tool on the runtime
      # it targets is the fix that does not depend on knowing why.
      #
      # `hanging-process` stays on: it uses why-is-node-running, which needs
      # node's async_hooks and so printed nothing at all under bun. If a hang
      # survives this, it can finally name the handle.
      - run: node node_modules/vitest/vitest.mjs run --coverage --exclude "tests/parity.test.ts" --reporter=default --reporter=hanging-process
