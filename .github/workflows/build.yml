name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ts:
    name: TypeScript
    runs-on: ubuntu-latest
    # Without this a hang burns the full 6-hour job limit and reports as
    # "cancelled" — which reads like someone stopped it, not like a failure.
    # Every run for a month died that way. The suite takes ~30s, so 8 minutes is
    # already generous, and a timeout here is a loud, correctly-labelled failure.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # Whole-tree PII scan. The commit hook only sees added lines, so data
      # already in the tree is invisible to it — that is how real workspace data
      # once reached npm. This is the gate that catches it before a merge.
      - run: bun run scan-pii:all
      - run: bun run typecheck
      - run: bun run build
      # Diagnostic, not a fix. Every run for a month has died the same way: all
      # test files complete and pass, then vitest never prints the summary and
      # the job burns its timeout, leaving orphan bun/node processes behind. So
      # something keeps the process alive after the run. Two hypotheses have
      # already been tried and disproved (the v8 coverage provider; `bunx`
      # resolving vitest at run time), and it does not reproduce on Linux at 2
      # cores under the same bun. `hanging-process` uses why-is-node-running to
      # name the open handle instead of guessing at it again.
      - run: bun run vitest run --coverage --exclude "tests/parity.test.ts" --reporter=default --reporter=hanging-process
