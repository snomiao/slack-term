name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ts:
    name: TypeScript
    runs-on: ubuntu-latest
    # Without this a hang burns the full 6-hour job limit and reports as
    # "cancelled" — which reads like someone stopped it, not like a failure.
    # Both passes together take ~5 minutes locally, so 15 is generous, and a
    # timeout here is a loud, correctly-labelled failure.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # Whole-tree PII scan. The commit hook only sees added lines, so data
      # already in the tree is invisible to it — that is how real workspace data
      # once reached npm. This is the gate that catches it before a merge.
      - run: bun run scan-pii:all
      - run: bun run typecheck
      - run: bun run build
      # The suite runs under bun's own test runner. Native, so the whole class
      # of vitest-under-bun failures this repo spent a month on (v8 coverage
      # reporting 0% and then hanging for six hours, worker deadlocks on async
      # `vi.mock` factories, keep-alive sockets stalling `server.close()`) simply
      # does not arise.
      #
      # `--parallel` implies `--isolate`, and isolation is mandatory rather than
      # tuning: bun's `mock.module` is process-wide, so without a fresh global
      # per file the module mock in tests/todo.test.ts leaks into
      # tests/auth.test.ts — measured, that costs 92 failing tests, not one.
      #
      # Two workers, not the default (one per core). These tests spawn CLI
      # subprocesses and stand up HTTP mock servers, so they contend on
      # something other than CPU: measured on an 18-core box, `=2` ran 27-34s,
      # `=4` swung between 50s and 133s, and the unbounded default produced a
      # 40s run and a 178s one with an extra failure.
      #
      # The 90s timeout replaces the per-describe timeouts, which bun accepts
      # and then silently ignores.
      - run: bun run test

      # Second pass, for the coverage gate only. bun reports lines and functions
      # and emits no branch data at all — not in its table, and not in its lcov
      # (measured on 1.3.13: no BRDA/BRF/BRH records). The branch threshold has
      # caught real defects here, so vitest+istanbul stays as the measuring
      # instrument even though bun is the runner.
      #
      # `node`, not bun: vitest is a node tool, and running it under bun is what
      # produced the hangs above. parity is excluded — it needs the release Rust
      # binary, which this job does not build.
      - run: node node_modules/vitest/vitest.mjs run --coverage --exclude "tests/parity.test.ts" --no-file-parallelism
